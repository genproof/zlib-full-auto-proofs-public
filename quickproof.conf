# Laws known to be false on this code (bugs whose fix is not applied): stated in src/contracts/ but left
# out of suite (new_contract.py --suite-exclude; qp verify takes the exclusion from src/contracts/suite.v).
# None since fixes F8 (api_reset) and F9 (res_compress_bound) of patch/PATCH.md.
BROKEN=()
