# quickproof config for zlib (quickproof/tools/clight.sh): the library units.  qp adds one unit per harness/*.c.
#
# Per-law linking (quickproof docs/LINKING.md): each law's program links only the units its harness needs (the checksum
# laws: adler32.c or crc32.c alone; the inflate laws: inflate.c, inffast.c, inftrees.c, adler32.c, crc32.c, zutil.c,
# libc.c; deflate_api: deflate.c, trees.c, adler32.c, crc32.c, zutil.c, libc.c).
LINK=per-law
#
# Code under test: zlib 1.3.2 (da607da739fa), the core library without the gz* file API (gzlib.c, gzread.c,
# gzwrite.c, gzclose.c) and without infback.c (no law calls inflateBack): adler32.c, crc32.c, deflate.c, trees.c,
# inflate.c, inffast.c, inftrees.c, compress.c, uncompr.c, zutil.c.  zutil.c includes gzguts.h for its declarations
# only.  quickproof/libc/libc.c provides memcpy, memset, memcmp, memmove and calloc (zcalloc's 16-bit branch);
# malloc/free (zcalloc, zcfree, the harnesses) come from the framework's malloc unit.
# Configuration, as upstream's defaults except:
#  - -DZ_TESTW= (empty): crc32.c without the braided CRC (no W): crc32_z is the byte-wise table loop, with no
#    word-typed loads through byte pointers and no braid tables; the crc_table/x2n_table of crc32.h are constants;
#  - DYNAMIC_CRC_TABLE not defined (the default): static CRC tables, no first-use initialisation (z_once);
#  - no assembly, no Z_SOLO (zcalloc/zcfree used), GZIP/GUNZIP on (gzip wrappers), no LIT_MEM, no INFLATE_STRICT,
#    no INFLATE_ALLOW_INVALID_DISTANCE_TOOFAR_ARRR, no PKZIP_BUG_WORKAROUND, no ZLIB_DEBUG, no FASTEST.
INC=(-I. -isystem "$(gcc -print-file-name=include)")
DEFS=(-DZ_TESTW=)
ZLIB_UNITS=(
  "adler32.c=src/adler32"
  "crc32.c=src/crc32"
  "deflate.c=src/deflate"
  "trees.c=src/trees"
  "inflate.c=src/inflate"
  "inffast.c=src/inffast"
  "inftrees.c=src/inftrees"
  "compress.c=src/compress"
  "uncompr.c=src/uncompr"
  "zutil.c=src/zutil"
)
UNITS=(
  "${ZLIB_UNITS[@]}"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"   # the unit that owns malloc/free (VST's mem_mgr)
)
# CompCert's interpreter (quickproof/tools/interp.sh) puts every unit into one translation unit and renames the struct
# tags each .c file defines (trees.c: struct static_tree_desc_s), which breaks deflate.h's typedef of it: there the
# zlib files are one unit (patch/interp_unity.c).  INTERP_UNITS replaces UNITS for the interpreter only (docs/QP.md);
# clight.sh and the contracts use UNITS.
INTERP_UNITS=(
  "patch/interp_unity.c=src/zlib_unity"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)

# one unit per harness/*.c (added by tools/qp)
